name: CI

# Actions minutes are limited on this private repository (owner decision, chore/ci-minutes):
# - docs-only changes (Markdown) start no CI;
# - draft PRs run only the quick checks job; the heavy jobs (production, e2e, QA) start when the PR
#   is marked ready for review and run on every later push to it;
# - a push to `main` (a merge) re-runs checks and the production build (it deploys), not e2e.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, format and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Prettier
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test

  build:
    name: Production build and production regression
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build (same command as Cloudflare Workers Builds)
        run: npm run build
      - name: Production regression (no DEV code, SPA fallback, playable build)
        run: npm run test:production

  e2e:
    name: Browser end-to-end (dev server)
    # Not on draft PRs, not again on the merge to `main` (it already passed on the PR).
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      GAME_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$GAME_URL" > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Prototype and alpha browser tests
        run: npm run test:e2e
      # Artifacts count against the account's 0.5 GB Actions storage: keep them only to debug a failure.
      - name: Upload server log and artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            artifacts/
            vite.log
          if-no-files-found: ignore
          retention-days: 1

  qa:
    name: QA preview build and browser regression
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:qa
      - run: npm run test:qa
      - name: Upload QA artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 1
